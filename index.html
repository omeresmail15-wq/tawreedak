<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a"><title>توريدك | Tawreedak</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');*{box-sizing:border-box}body{font-family:Cairo,sans-serif}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 8px 30px #0f172a0a}.toast{animation:t .2s}@keyframes t{from{transform:translateY(10px);opacity:0}}input,select,textarea{outline:0}input:focus,select:focus,textarea:focus{border-color:#2563eb!important;box-shadow:0 0 0 3px #2563eb18}@media print{.no-print{display:none!important}}</style>
</head><body class="bg-slate-50 text-slate-800"><div id="app"></div><div id="toast" class="fixed bottom-5 left-5 z-[99] space-y-2"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,deleteDoc,query,where,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDkfllpodJQvGcemzcr6FIDLNjdoJN-cws",authDomain:"tawreedak-saas.firebaseapp.com",projectId:"tawreedak-saas",storageBucket:"tawreedak-saas.firebasestorage.app",messagingSenderId:"745887419455",appId:"1:745887419455:web:0478e1a4950328d917fc8a",measurementId:"G-L5TQT2TRMD"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let S={user:null,profile:null,company:null,view:'dashboard',customers:[],products:[],quotes:[],followups:[]};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>Number(n||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م',date=v=>{if(!v)return'-';let d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?'-':d.toLocaleDateString('ar-EG')};
function toast(m,err=false){let x=document.createElement('div');x.className=`toast px-4 py-3 rounded-xl text-white text-sm font-bold shadow-xl ${err?'bg-red-600':'bg-slate-900'}`;x.textContent=m;$('#toast').append(x);setTimeout(()=>x.remove(),3000)}
async function profile(uid){let x=await getDoc(doc(db,'users',uid));if(!x.exists())throw Error('بيانات المستخدم غير موجودة');return x.data()}
async function list(c,id){let q=query(collection(db,c),where('companyId','==',id)),s=await getDocs(q);return s.docs.map(d=>({id:d.id,...d.data()}))}
async function load(){if(!S.profile)return;let cid=S.profile.companyId,c=await getDoc(doc(db,'companies',cid));S.company=c.exists()?c.data():{};[S.customers,S.products,S.quotes,S.followups]=await Promise.all([list('customers',cid),list('products',cid),list('quotes',cid),list('followups',cid)]);render()}
async function register(email,password,companyName,userName){let cr;try{cr=await createUserWithEmailAndPassword(auth,email,password);let cid='comp_'+cr.user.uid;await setDoc(doc(db,'companies',cid),{name:companyName,email,createdAt:serverTimestamp(),subscriptionPlan:'Free',subscriptionStatus:'active',subscriptionStart:new Date().toISOString(),subscriptionEnd:new Date(Date.now()+30*864e5).toISOString()});await setDoc(doc(db,'users',cr.user.uid),{companyId:cid,name:userName,email,role:'Owner',createdAt:serverTimestamp()})}catch(e){if(cr?.user)try{await cr.user.delete()}catch{}throw e}}
async function createQuote(q,items){let cid=S.profile.companyId,ref=doc(db,'company_counters',cid),year=new Date().getFullYear();return runTransaction(db,async tx=>{let old=await tx.get(ref),n=old.exists()?Number(old.data().lastQuoteNumber||0)+1:1;tx.set(ref,{lastQuoteNumber:n},{merge:true});let qr=doc(collection(db,'quotes')),number=`QT-${year}-${String(n).padStart(4,'0')}`;tx.set(qr,{...q,companyId:cid,quoteNumber:number,createdAt:serverTimestamp()});items.forEach(i=>{let r=doc(collection(db,'quote_items'));tx.set(r,{quoteId:qr.id,companyId:cid,productId:i.productId||'',nameSnapshot:i.name,unitPrice:Number(i.unitPrice),quantity:Number(i.quantity),total:Number(i.unitPrice)*Number(i.quantity)})});return{ id:qr.id,number}})}
const nav=[['dashboard','لوحة التحكم','layout-dashboard'],['customers','العملاء','users'],['products','المنتجات','package'],['quotes','عروض الأسعار','file-text'],['followups','المتابعات','bell']];
function authView(){ $('#app').innerHTML=`<main class="min-h-screen grid lg:grid-cols-2"><section class="hidden lg:flex bg-slate-950 text-white p-14 items-center"><div class="max-w-xl mx-auto"><div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-3xl font-extrabold">ت</div><h1 class="text-4xl font-extrabold mt-7 leading-tight">توريدك<br><span class="text-blue-400">إدارة أعمالك باحتراف</span></h1><p class="text-slate-400 mt-5 leading-8">نظام سحابي لإدارة العملاء والمنتجات وعروض الأسعار والمتابعات لشركات التوريدات والمقاولات.</p><div class="grid grid-cols-2 gap-3 mt-8">${['سحابي بالكامل','عزل بيانات الشركات','عروض أسعار','مشاركة واتساب'].map(x=>`<div class="bg-white/5 p-4 rounded-2xl text-sm">✓ ${x}</div>`).join('')}</div></div></section><section class="flex items-center justify-center p-5"><div class="w-full max-w-md"><div class="text-center mb-6"><div class="w-14 h-14 bg-blue-600 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl font-extrabold">ت</div><h2 class="text-2xl font-extrabold mt-3">توريدك | Tawreedak</h2></div><div class="card p-6"><div class="flex bg-slate-100 p-1 rounded-xl mb-6"><button id="loginTab" class="flex-1 py-2 rounded-lg bg-white font-bold shadow">دخول</button><button id="regTab" class="flex-1 py-2 rounded-lg text-slate-500 font-bold">حساب جديد</button></div><form id="auth" class="space-y-3"><div id="reg" class="hidden space-y-3"><input id="company" required class="w-full border rounded-xl px-4 py-3" placeholder="اسم الشركة"><input id="name" required class="w-full border rounded-xl px-4 py-3" placeholder="اسم المستخدم"></div><input id="email" type="email" required class="w-full border rounded-xl px-4 py-3" placeholder="البريد الإلكتروني"><input id="pass" type="password" minlength="6" required class="w-full border rounded-xl px-4 py-3" placeholder="كلمة المرور"><button class="w-full bg-blue-600 text-white rounded-xl py-3 font-extrabold">متابعة</button><div id="ae" class="text-red-600 text-sm text-center"></div></form></div></div></section></main>`;let mode='login';$('#loginTab').onclick=()=>{mode='login';$('#reg').classList.add('hidden')};$('#regTab').onclick=()=>{mode='reg';$('#reg').classList.remove('hidden')};$('#auth').onsubmit=async e=>{e.preventDefault();$('#ae').textContent='جارٍ التنفيذ...';try{if(mode==='login')await signInWithEmailAndPassword(auth,$('#email').value,$('#pass').value);else await register($('#email').value,$('#pass').value,$('#company').value,$('#name').value)}catch(x){$('#ae').textContent=x.message}}}
function shell(){return `<div class="min-h-screen lg:flex"><aside class="no-print hidden lg:flex fixed right-0 inset-y-0 w-64 bg-slate-950 text-white flex-col"><div class="p-5 border-b border-white/10"><div class="flex items-center gap-3"><div class="w-11 h-11 bg-blue-600 rounded-2xl flex items-center justify-center text-xl font-extrabold">ت</div><div><b>توريدك</b><div class="text-xs text-slate-400">Tawreedak SaaS</div></div></div></div><nav class="p-3 space-y-1">${nav.map(n=>`<button data-nav="${n[0]}" class="w-full flex items-center gap-3 p-3 rounded-xl text-sm ${S.view===n[0]?'bg-blue-600':'text-slate-300 hover:bg-white/5'}">${n[1]}</button>`).join('')}</nav><div class="mt-auto p-4"><div class="bg-white/5 rounded-2xl p-4 mb-3 text-sm"><span class="text-slate-400">الشركة</span><b class="block mt-1 truncate">${esc(S.company?.name)}</b><span class="text-emerald-400 text-xs">الخطة ${esc(S.company?.subscriptionPlan||'Free')}</span></div><button id="logout" class="w-full bg-red-500/10 text-red-300 p-3 rounded-xl">تسجيل الخروج</button></div></aside><main class="flex-1 lg:mr-64"><header class="no-print sticky top-0 z-20 bg-white/90 backdrop-blur border-b p-4"><div class="flex justify-between items-center"><div><h1 class="font-extrabold text-xl">${nav.find(n=>n[0]===S.view)?.[1]}</h1><span class="text-xs text-slate-500">${esc(S.profile?.name||'')}</span></div><button id="mlogout" class="lg:hidden bg-red-50 text-red-600 px-3 py-2 rounded-xl">خروج</button></div><div class="lg:hidden flex gap-2 overflow-x-auto mt-3">${nav.map(n=>`<button data-nav="${n[0]}" class="whitespace-nowrap px-3 py-2 rounded-xl text-xs font-bold ${S.view===n[0]?'bg-blue-600 text-white':'bg-slate-100'}">${n[1]}</button>`).join('')}</div></header><section id="content" class="p-4 md:p-7 max-w-7xl mx-auto"></section></main></div>`}
function dashboard(){let total=S.quotes.reduce((a,q)=>a+Number(q.total||0),0);return `<div class="space-y-6"><div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${[['العملاء',S.customers.length],['المنتجات',S.products.length],['عروض الأسعار',S.quotes.length],['قيمة العروض',money(total)]].map(x=>`<div class="card p-5"><div class="text-xs text-slate-500">${x[0]}</div><b class="text-xl md:text-2xl block mt-2">${x[1]}</b></div>`).join('')}</div><div class="card p-5"><div class="flex justify-between mb-4"><b>آخر عروض الأسعار</b><button data-nav="quotes" class="text-blue-600 text-sm font-bold">عرض الكل</button></div>${S.quotes.length?S.quotes.slice(-7).reverse().map(q=>`<div class="flex justify-between p-3 border-b last:border-0"><div><b>${esc(q.quoteNumber)}</b><div class="text-xs text-slate-500">${esc(q.customerName||'-')} • ${date(q.createdAt)}</div></div><b>${money(q.total)}</b></div>`).join(''):'<div class="text-center text-slate-400 py-10">لا توجد عروض أسعار بعد</div>'}</div></div>`}
function dataPage(type){let c=type==='customers',arr=c?S.customers:S.products;return `<div class="space-y-5"><div class="flex justify-between items-center"><div><h2 class="text-xl font-extrabold">${c?'العملاء':'المنتجات'}</h2><p class="text-sm text-slate-500">إدارة بياناتك بسهولة</p></div><button id="add" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-bold">+ ${c?'عميل':'منتج'}</button></div><div class="card overflow-hidden"><div class="p-4 border-b"><input id="search" class="w-full border rounded-xl px-4 py-3" placeholder="بحث..."></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-4">الاسم</th><th>${c?'الهاتف':'الوحدة'}</th><th>${c?'البريد':'السعر'}</th><th>إجراء</th></tr></thead><tbody id="rows">${arr.map(x=>`<tr class="border-t"><td class="p-4 font-bold">${esc(x.name||x.productName)}</td><td>${esc(c?x.phone||'-':x.unit||'قطعة')}</td><td>${c?esc(x.email||'-'):money(x.price)}</td><td><button data-del="${x.id}" data-col="${c?'customers':'products'}" class="text-red-500">حذف</button></td></tr>`).join('')||'<tr><td colspan="4" class="p-10 text-center text-slate-400">لا توجد بيانات</td></tr>'}</tbody></table></div></div></div>`}
function quotes(){return `<div class="space-y-5"><div class="flex justify-between items-center"><div><h2 class="text-xl font-extrabold">عروض الأسعار</h2><p class="text-sm text-slate-500">إنشاء ومشاركة عروض احترافية</p></div><button id="newq" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-bold">+ عرض جديد</button></div><div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-4">الرقم</th><th>العميل</th><th>الإجمالي</th><th>التاريخ</th><th>مشاركة</th></tr></thead><tbody>${S.quotes.slice().reverse().map(q=>`<tr class="border-t"><td class="p-4 font-bold">${esc(q.quoteNumber)}</td><td>${esc(q.customerName||'-')}</td><td>${money(q.total)}</td><td>${date(q.createdAt)}</td><td><button data-wa="${q.id}" class="text-emerald-600">واتساب</button></td></tr>`).join('')||'<tr><td colspan="5" class="p-10 text-center text-slate-400">لا توجد عروض</td></tr>'}</tbody></table></div></div>`}
function followups(){return `<div class="space-y-5"><div class="flex justify-between"><div><h2 class="text-xl font-extrabold">المتابعات</h2><p class="text-sm text-slate-500">نظم فرص البيع والمتابعة</p></div><button id="addf" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-bold">+ متابعة</button></div><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${S.followups.map(f=>`<div class="card p-5"><b>${esc(f.title)}</b><div class="text-xs text-blue-600 mt-2">${date(f.dueDate)}</div><p class="text-sm text-slate-500 mt-3">${esc(f.notes||'')}</p></div>`).join('')||'<div class="card p-10 text-center text-slate-400 md:col-span-3">لا توجد متابعات</div>'}</div></div>`}
function render(){if(!S.user){authView();return}$('#app').innerHTML=shell();$('#content').innerHTML=S.view==='dashboard'?dashboard():S.view==='customers'?dataPage('customers'):S.view==='products'?dataPage('products'):S.view==='quotes'?quotes():followups();bind();try{lucide.createIcons()}catch{}}
function bind(){document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>{S.view=x.dataset.nav;render()});$('#logout')?.addEventListener('click',()=>signOut(auth));$('#mlogout')?.addEventListener('click',()=>signOut(auth));$('#add')?.addEventListener('click',()=>addData(S.view==='customers'));$('#newq')?.addEventListener('click',newQuote);$('#addf')?.addEventListener('click',addFollow);document.querySelectorAll('[data-del]').forEach(x=>x.onclick=async()=>{if(confirm('حذف العنصر؟')){await deleteDoc(doc(db,x.dataset.col,x.dataset.del));await load();toast('تم الحذف')}});document.querySelectorAll('[data-wa]').forEach(x=>x.onclick=()=>{let q=S.quotes.find(z=>z.id===x.dataset.wa);open('https://wa.me/?text='+encodeURIComponent(`عرض سعر ${q.quoteNumber} من ${S.company?.name||'توريدك'}\nالعميل: ${q.customerName||''}\nالإجمالي: ${money(q.total)}`),'_blank')})}
function modal(title,html){let d=document.createElement('div');d.className='fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4';d.innerHTML=`<div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-auto"><div class="p-5 border-b flex justify-between"><b>${title}</b><button id="close">✕</button></div><div class="p-5">${html}</div></div>`;document.body.append(d);d.querySelector('#close').onclick=()=>d.remove();return d}
function addData(customer){let d=modal(customer?'إضافة عميل':'إضافة منتج',customer?`<form id="f" class="space-y-3"><input id="n" required class="w-full border rounded-xl p-3" placeholder="اسم العميل"><input id="p" class="w-full border rounded-xl p-3" placeholder="الهاتف"><input id="e" type="email" class="w-full border rounded-xl p-3" placeholder="البريد"><button class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">حفظ</button></form>`:`<form id="f" class="space-y-3"><input id="n" required class="w-full border rounded-xl p-3" placeholder="اسم المنتج"><input id="p" required type="number" class="w-full border rounded-xl p-3" placeholder="السعر"><input id="u" class="w-full border rounded-xl p-3" placeholder="الوحدة"><button class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">حفظ</button></form>`);d.querySelector('form').onsubmit=async e=>{e.preventDefault();let x=customer?{name:$('#n').value,phone:$('#p').value,email:$('#e').value}:{name:$('#n').value,productName:$('#n').value,price:Number($('#p').value),unit:$('#u').value||'قطعة'};await addDoc(collection(db,customer?'customers':'products'),{...x,companyId:S.profile.companyId,createdAt:serverTimestamp()});d.remove();await load();toast('تم الحفظ')}}
function newQuote(){let d=modal('عرض سعر جديد',`<form id="q" class="space-y-3"><select id="c" required class="w-full border rounded-xl p-3"><option value="">اختر العميل</option>${S.customers.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><div id="items"></div><button type="button" id="ai" class="text-blue-600 font-bold">+ إضافة منتج</button><textarea id="notes" class="w-full border rounded-xl p-3" placeholder="ملاحظات وشروط"></textarea><div class="p-3 rounded-xl bg-blue-50 font-extrabold">الإجمالي: <span id="tot">0.00 ج.م</span></div><button class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">إنشاء العرض</button></form>`);let box=d.querySelector('#items');function row(){let r=document.createElement('div');r.className='grid grid-cols-12 gap-2 mb-2';r.innerHTML=`<select class="pr col-span-7 border rounded-xl p-2"><option value="">اختر المنتج</option>${S.products.map(x=>`<option value="${x.id}" data-price="${x.price}">${esc(x.name||x.productName)} — ${money(x.price)}</option>`).join('')}</select><input class="qty col-span-3 border rounded-xl p-2" type="number" min="1" value="1"><button type="button" class="rm col-span-2 text-red-500">حذف</button>`;box.append(r);r.querySelector('.pr').onchange=calc;r.querySelector('.qty').oninput=calc;r.querySelector('.rm').onclick=()=>{r.remove();calc()}}function calc(){let t=0;box.querySelectorAll('.grid').forEach(r=>{let s=r.querySelector('.pr'),o=s.options[s.selectedIndex];t+=Number(o?.dataset.price||0)*Number(r.querySelector('.qty').value||0)});$('#tot').textContent=money(t)}$('#ai').onclick=row;row();d.querySelector('#q').onsubmit=async e=>{e.preventDefault();let items=[...box.querySelectorAll('.grid')].map(r=>{let s=r.querySelector('.pr'),o=s.options[s.selectedIndex];return{productId:s.value,name:o?.textContent?.split(' — ')[0]||'',unitPrice:Number(o?.dataset.price||0),quantity:Number(r.querySelector('.qty').value||0)}}).filter(x=>x.productId);if(!items.length)return toast('أضف منتجًا واحدًا على الأقل',true);let customer=S.customers.find(x=>x.id===$('#c').value),total=items.reduce((a,x)=>a+x.unitPrice*x.quantity,0);await createQuote({customerId:customer.id,customerName:customer.name,subtotal:total,total,discount:0,tax:0,notes:$('#notes').value,status:'draft'},items);d.remove();await load();toast('تم إنشاء عرض السعر')}}
function addFollow(){let d=modal('إضافة متابعة',`<form id="f" class="space-y-3"><input id="t" required class="w-full border rounded-xl p-3" placeholder="عنوان المتابعة"><input id="dt" required type="date" class="w-full border rounded-xl p-3"><textarea id="no" class="w-full border rounded-xl p-3" placeholder="ملاحظات"></textarea><button class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">حفظ</button></form>`);d.querySelector('form').onsubmit=async e=>{e.preventDefault();await addDoc(collection(db,'followups'),{companyId:S.profile.companyId,title:$('#t').value,dueDate:$('#dt').value,notes:$('#no').value,status:'pending',createdAt:serverTimestamp()});d.remove();await load();toast('تمت إضافة المتابعة')}}
onAuthStateChanged(auth,async u=>{S.user=u;if(!u){S.profile=null;render();return}try{S.profile=await profile(u.uid);await load()}catch(e){toast(e.message,true);await signOut(auth)}});render();
</script></body></html>
