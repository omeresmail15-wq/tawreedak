<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";import{getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,deleteDoc,query,where,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDkfllpodJQvGcemzcr6FIDLNjdoJN-cws",
  authDomain: "tawreedak-saas.firebaseapp.com",

console.log("Firebase App:", app);

function icon(n,s=18){return`<i data-lucide="${n}" width="${s}" height="${s}"></i>`}function icons(){try{lucide.createIcons()}catch{}}function toast(m,bad=false){const e=document.createElement('div');e.className=`${bad?'bg-red-600':'bg-slate-900'} text-white px-4 py-3 rounded-xl shadow-xl text-sm font-bold`;e.textContent=m;$('#toast').append(e);setTimeout(()=>e.remove(),3000)}
async function userData(uid){const x=await getDoc(doc(db,'users',uid));if(!x.exists())throw Error('بيانات المستخدم غير موجودة');return x.data()}async function company(id){const x=await getDoc(doc(db,'companies',id));return x.exists()?{id:x.id,...x.data()}:null}async function list(col,id){const q=query(collection(db,col),where('companyId','==',id));const s=await getDocs(q);return s.docs.map(x=>({id:x.id,...x.data()}))}async function load(){S.company=await company(S.profile.companyId);[S.customers,S.products,S.quotes,S.followups]=await Promise.all(['customers','products','quotes','followups'].map(c=>list(c,S.profile.companyId)));render()}
function authError(m){if(m.includes('invalid-credential'))return'البريد أو كلمة المرور غير صحيحة.';if(m.includes('email-already-in-use'))return'البريد مستخدم بالفعل.';if(m.includes('weak-password'))return'كلمة المرور يجب أن تكون 6 أحرف على الأقل.';return m}
function renderAuth(){document.body.className='bg-slate-50 text-slate-800';$('#app').innerHTML=`<div class="min-h-screen grid lg:grid-cols-2"><div class="hidden lg:flex bg-slate-950 text-white p-12 items-center"><div class="max-w-lg mx-auto"><div class="w-16 h-16 rounded-2xl bg-blue-600 flex items-center justify-center text-3xl font-extrabold mb-6">ت</div><h1 class="text-4xl font-extrabold leading-tight">توريدك<br><span class="text-blue-400">إدارة أعمالك باحتراف.</span></h1><p class="text-slate-400 mt-5 leading-8">منصة سحابية لإدارة العملاء والمنتجات وعروض الأسعار والمتابعات.</p></div></div><div class="flex items-center justify-center p-5"><div class="w-full max-w-md"><div class="text-center mb-6"><div class="w-14 h-14 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl font-extrabold mx-auto mb-3">ت</div><h2 class="text-2xl font-extrabold">توريدك | Tawreedak</h2><p class="text-sm text-slate-500">نظام إدارة التوريدات السحابي</p></div><div class="card p-6"><div class="flex bg-slate-100 p-1 rounded-xl mb-5"><button id="lt" class="flex-1 py-2 rounded-lg bg-white font-bold">دخول</button><button id="rt" class="flex-1 py-2 rounded-lg text-slate-500">حساب جديد</button></div><form id="af" class="space-y-3"><div id="cb" class="hidden space-y-3"><input id="cn" class="w-full border rounded-xl px-4 py-3" placeholder="اسم الشركة"><input id="un" class="w-full border rounded-xl px-4 py-3" placeholder="اسم المسؤول"></div><input id="em" type="email" required class="w-full border rounded-xl px-4 py-3" placeholder="البريد الإلكتروني"><input id="pw" type="password" required minlength="6" class="w-full border rounded-xl px-4 py-3" placeholder="كلمة المرور"><button class="w-full bg-blue-600 text-white py-3 rounded-xl font-extrabold">متابعة</button><div id="ae" class="text-center text-xs text-red-600"></div></form></div></div></div></div>`;let reg=false;$('#rt').onclick=()=>{reg=true;$('#cb').classList.remove('hidden');$('#rt').className='flex-1 py-2 rounded-lg bg-white font-bold';$('#lt').className='flex-1 py-2 rounded-lg text-slate-500'};$('#lt').onclick=()=>{reg=false;$('#cb').classList.add('hidden');$('#lt').className='flex-1 py-2 rounded-lg bg-white font-bold';$('#rt').className='flex-1 py-2 rounded-lg text-slate-500'};$('#af').onsubmit=async e=>{e.preventDefault();$('#ae').textContent='جارٍ التنفيذ...';try{if(reg){if(!$('#cn').value.trim()||!$('#un').value.trim())throw Error('اكتب اسم الشركة واسم المسؤول.');const c=await createUserWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value);const id='comp_'+c.user.uid;await setDoc(doc(db,'companies',id),{name:$('#cn').value.trim(),email:$('#em').value.trim(),createdAt:serverTimestamp(),subscriptionPlan:'Free',subscriptionStatus:'active',subscriptionStart:new Date().toISOString(),subscriptionEnd:new Date(Date.now()+30*864e5).toISOString()});await setDoc(doc(db,'users',c.user.uid),{companyId:id,name:$('#un').value.trim(),email:$('#em').value.trim(),role:'Owner',createdAt:serverTimestamp()})}else await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}catch(x){$('#ae').textContent=authError(x.message)}}}
const nav=[['dashboard','لوحة التحكم','layout-dashboard'],['customers','العملاء','users'],['products','المنتجات','package'],['quotes','عروض الأسعار','file-text'],['followups','المتابعات','bell']];function shell(){return`<div class="min-h-screen lg:pr-64"><aside class="no-print hidden lg:flex fixed right-0 inset-y-0 w-64 bg-slate-950 text-white flex-col z-40"><div class="p-5 border-b border-white/10 flex items-center gap-3"><div class="w-11 h-11 rounded-2xl bg-blue-600 flex items-center justify-center font-extrabold text-xl">ت</div><div><b>توريدك</b><div class="text-xs text-slate-500">Tawreedak</div></div></div><nav class="p-3 space-y-1">${nav.map(n=>`<button data-nav="${n[0]}" class="w-full flex gap-3 items-center px-4 py-3 rounded-xl text-sm ${S.view===n[0]?'bg-blue-600':'text-slate-300 hover:bg-white/5'}">${icon(n[2])}${n[1]}</button>`).join('')}</nav><div class="mt-auto p-4"><div class="bg-white/5 rounded-xl p-3 text-sm"><div class="text-slate-400 text-xs">الشركة</div><b>${esc(S.company?.name||'')}</b><div class="text-emerald-400 text-xs mt-1">الخطة: Free</div></div><button id="logout" class="w-full mt-3 bg-red-500/10 text-red-300 rounded-xl py-3">${icon('log-out')} خروج</button></div></aside><main><header class="no-print sticky top-0 z-30 bg-white/90 backdrop-blur border-b p-4"><div class="flex justify-between items-center"><div><h1 class="font-extrabold text-lg">${nav.find(x=>x[0]===S.view)[1]}</h1><div class="text-xs text-slate-400">${esc(S.profile?.name||'')}</div></div><button id="mlogout" class="lg:hidden text-red-600">${icon('log-out')}</button></div><div class="lg:hidden flex gap-2 overflow-x-auto mt-3">${nav.map(n=>`<button data-nav="${n[0]}" class="whitespace-nowrap px-3 py-2 rounded-xl text-xs font-bold ${S.view===n[0]?'bg-blue-600 text-white':'bg-slate-100'}">${n[1]}</button>`).join('')}</div></header><section id="content" class="p-4 md:p-7 max-w-7xl mx-auto"></section></main></div>`}
function dashboard(){const total=S.quotes.reduce((a,q)=>a+Number(q.total||0),0);return`<div class="space-y-5"><div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${[['العملاء',S.customers.length,'users'],['المنتجات',S.products.length,'package'],['العروض',S.quotes.length,'file-text'],['قيمة العروض',money(total),'wallet']].map(x=>`<div class="card p-5"><div class="flex justify-between"><div><div class="text-xs text-slate-500">${x[0]}</div><div class="font-extrabold text-xl mt-2">${x[1]}</div></div><div class="w-11 h-11 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center">${icon(x[2])}</div></div></div>`).join('')}</div><div class="grid lg:grid-cols-3 gap-5"><div class="card p-5 lg:col-span-2"><div class="flex justify-between mb-4"><h2 class="font-extrabold">آخر عروض الأسعار</h2><button data-nav="quotes" class="text-blue-600 text-sm font-bold">عرض الكل</button></div>${S.quotes.length?S.quotes.slice().reverse().slice(0,7).map(q=>`<div class="flex justify-between p-3 rounded-xl bg-slate-50 mb-2"><div><b>${esc(q.quoteNumber)}</b><div class="text-xs text-slate-500">${esc(q.customerName||'-')} • ${date(q.createdAt)}</div></div><b>${money(q.total)}</b></div>`).join(''):`<div class="text-center text-slate-400 py-10">لا توجد عروض أسعار بعد</div>`}</div><div class="card p-5"><h2 class="font-extrabold">المتابعات</h2>${S.followups.slice(0,6).map(f=>`<div class="mt-3 p-3 border rounded-xl"><b class="text-sm">${esc(f.title)}</b><div class="text-xs text-slate-500">${date(f.dueDate)}</div></div>`).join('')||`<div class="text-center text-slate-400 py-10 text-sm">لا توجد متابعات</div>`}</div></div></div>`}
function rows(type){const c=type==='customers',a=c?S.customers:S.products;return a.length?a.map(x=>`<tr class="border-t"><td class="p-4 font-bold">${esc(x.name||x.productName)}</td>${c?`<td>${esc(x.phone||'-')}</td><td>${esc(x.email||'-')}</td>`:`<td>${esc(x.unit||'قطعة')}</td><td>${money(x.price)}</td>`}<td><button data-del="${x.id}" data-col="${c?'customers':'products'}" class="text-red-500 p-2">${icon('trash-2')}</button></td></tr>`).join(''):`<tr><td colspan="4" class="p-12 text-center text-slate-400">لا توجد بيانات</td></tr>`}function table(type){const c=type==='customers';return`<div class="space-y-5"><div class="flex justify-between items-center"><div><h2 class="text-xl font-extrabold">${c?'العملاء':'المنتجات'}</h2><p class="text-sm text-slate-500">${c?'إدارة قاعدة العملاء':'إدارة المنتجات والأسعار'}</p></div><button id="add" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-bold flex gap-2">${icon('plus')} إضافة</button></div><div class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr>${c?'<th class="p-4 text-right">الاسم</th><th>الهاتف</th><th>البريد</th>':'<th class="p-4 text-right">المنتج</th><th>الوحدة</th><th>السعر</th>'}<th>إجراء</th></tr></thead><tbody>${rows(type)}</tbody></table></div></div></div>`}
function quotes(){return`<div class="space-y-5"><div class="flex justify-between items-center"><div><h2 class="text-xl font-extrabold">عروض الأسعار</h2><p class="text-sm text-slate-500">إنشاء ومشاركة عروض احترافية</p></div><button id="newq" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-bold">${icon('plus')} عرض جديد</button></div><div class="card overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="p-4">الرقم</th><th>العميل</th><th>الإجمالي</th><th>التاريخ</th><th>إجراء</th></tr></thead><tbody>${S.quotes.length?S.quotes.slice().reverse().map(q=>`<tr class="border-t"><td class="p-4 font-bold">${esc(q.quoteNumber)}</td><td>${esc(q.customerName)}</td><td>${money(q.total)}</td><td>${date(q.createdAt)}</td><td><button data-wa="${q.id}" class="text-emerald-600 p-2">${icon('message-circle')}</button><button data-pr="${q.id}" class="text-blue-600 p-2">${icon('printer')}</button></td></tr>`).join(''):`<tr><td colspan="5" class="p-12 text-center text-slate-400">لا توجد عروض</td></tr>`}</tbody></table></div></div>`}
function followups(){return`<div class="space-y-5"><div class="flex justify-between items-center"><div><h2 class="text-xl font-extrabold">المتابعات</h2><p class="text-sm text-slate-500">تابع فرص البيع في مواعيدها</p></div><button id="addf" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-bold">${icon('plus')} متابعة</button></div><div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${S.followups.map(f=>`<div class="card p-5"><div class="flex justify-between gap-2"><b>${esc(f.title)}</b><span class="text-xs bg-blue-50 text-blue-600 px-2 py-1 rounded-lg">${date(f.dueDate)}</span></div><p class="text-sm text-slate-500 mt-3">${esc(f.notes||'')}</p></div>`).join('')||`<div class="card p-12 text-center text-slate-400 md:col-span-3">لا توجد متابعات</div>`}</div></div>`}
function render(){if(!S.user){renderAuth();return}$('#app').innerHTML=shell();$('#content').innerHTML=S.view==='dashboard'?dashboard():S.view==='customers'?table('customers'):S.view==='products'?table('products'):S.view==='quotes'?quotes():followups();bind();icons()}
function modal(title,body){const d=document.createElement('div');d.className='fixed inset-0 z-50 bg-slate-950/50 flex items-center justify-center p-4';d.innerHTML=`<div class="bg-white w-full max-w-lg max-h-[92vh] overflow-auto rounded-2xl"><div class="p-5 border-b flex justify-between"><b>${title}</b><button class="close">${icon('x')}</button></div><div class="p-5">${body}</div></div>`;document.body.append(d);d.querySelector('.close').onclick=()=>d.remove();icons();return d}
function dataModal(customer){const d=modal(customer?'إضافة عميل':'إضافة منتج',customer?`<form id="f" class="space-y-3"><input id="n" required class="w-full border rounded-xl p-3" placeholder="اسم العميل"><input id="p" class="w-full border rounded-xl p-3" placeholder="رقم الهاتف"><input id="e" class="w-full border rounded-xl p-3" placeholder="البريد الإلكتروني"><textarea id="no" class="w-full border rounded-xl p-3" placeholder="ملاحظات"></textarea><button class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">حفظ</button></form>`:`<form id="f" class="space-y-3"><input id="n" required class="w-full border rounded-xl p-3" placeholder="اسم المنتج"><input id="p" type="number" min="0" required class="w-full border rounded-xl p-3" placeholder="السعر"><input id="u" class="w-full border rounded-xl p-3" placeholder="الوحدة"><textarea id="no" class="w-full border rounded-xl p-3" placeholder="ملاحظات"></textarea><button class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">حفظ</button></form>`);d.querySelector('#f').onsubmit=async e=>{e.preventDefault();try{const data=customer?{name:$('#n').value,phone:$('#p').value,email:$('#e').value,notes:$('#no').value}:{name:$('#n').value,productName:$('#n').value,price:Number($('#p').value),unit:$('#u').value||'قطعة',notes:$('#no').value};await addDoc(collection(db,customer?'customers':'products'),{...data,companyId:S.profile.companyId,createdAt:serverTimestamp()});d.remove();await load();toast('تم الحفظ')}catch(x){toast(x.message,true)}}}
function quoteModal(){const d=modal('إنشاء عرض سعر',`<form id="qf" class="space-y-4"><select id="qc" required class="w-full border rounded-xl p-3"><option value="">اختر العميل</option>${S.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><div class="border rounded-2xl p-4 bg-slate-50"><div class="flex justify-between mb-3"><b>بنود العرض</b><button type="button" id="additem" class="text-blue-600 font-bold">+ إضافة بند</button></div><div id="items" class="space-y-2"></div></div><div class="grid grid-cols-2 gap-2"><input id="disc" type="number" min="0" value="0" class="border rounded-xl p-3" placeholder="خصم"><input id="tax" type="number" min="0" value="0" class="border rounded-xl p-3" placeholder="ضريبة %"></div><textarea id="qn" class="w-full border rounded-xl p-3" placeholder="ملاحظات وشروط"></textarea><div class="p-4 bg-blue-50 rounded-xl flex justify-between font-extrabold"><span>الإجمالي</span><span id="tot">0.00 ج.م</span></div><button class="w-full bg-blue-600 text-white p-3 rounded-xl font-extrabold">إنشاء العرض</button></form>`);const box=d.querySelector('#items');function add(){const r=document.createElement('div');r.className='grid grid-cols-12 gap-2';r.innerHTML=`<select class="pr col-span-7 border rounded-xl p-2"><option value="">اختر المنتج</option>${S.products.map(p=>`<option value="${p.id}" data-price="${Number(p.price||0)}">${esc(p.name||p.productName)} — ${money(p.price)}</option>`).join('')}</select><input class="qt col-span-3 border rounded-xl p-2" type="number" min="1" value="1"><button type="button" class="rm col-span-2 text-red-500">${icon('trash-2')}</button>`;box.append(r);r.querySelector('.pr').onchange=calc;r.querySelector('.qt').oninput=calc;r.querySelector('.rm').onclick=()=>{r.remove();calc()};icons()}function calc(){let sub=0;box.querySelectorAll('.grid').forEach(r=>{const s=r.querySelector('.pr'),o=s.options[s.selectedIndex];sub+=Number(o?.dataset.price||0)*Number(r.querySelector('.qt').value||0)});const dis=Number($('#disc').value||0),tax=Number($('#tax').value||0),net=Math.max(0,sub-dis);$('#tot').textContent=money(net+net*tax/100)}d.querySelector('#additem').onclick=add;d.querySelector('#disc').oninput=calc;d.querySelector('#tax').oninput=calc;add();d.querySelector('#qf').onsubmit=async e=>{e.preventDefault();const customer=S.customers.find(c=>c.id===$('#qc').value);const items=[...box.querySelectorAll('.grid')].map(r=>{const s=r.querySelector('.pr'),o=s.options[s.selectedIndex];return{productId:s.value,name:(o?.textContent||'').split(' — ')[0],unitPrice:Number(o?.dataset.price||0),quantity:Number(r.querySelector('.qt').value||0)}}).filter(x=>x.productId);if(!items.length)return toast('أضف بندًا واحدًا على الأقل',true);const sub=items.reduce((a,x)=>a+x.unitPrice*x.quantity,0),dis=Number($('#disc').value||0),tax=Number($('#tax').value||0),net=Math.max(0,sub-dis),total=net+net*tax/100;try{const companyId=S.profile.companyId,counter=doc(db,'company_counters',companyId),year=new Date().getFullYear(),num=await runTransaction(db,async tx=>{const cd=await tx.get(counter),next=cd.exists()?Number(cd.data().lastQuoteNumber||0)+1:1;tx.set(counter,{lastQuoteNumber:next},{merge:true});const qr=doc(collection(db,'quotes')),n=`QT-${year}-${String(next).padStart(4,'0')}`;tx.set(qr,{companyId,customerId:customer?.id||'',customerName:customer?.name||'',subtotal:sub,discount:dis,tax,total,notes:$('#qn').value,status:'draft',quoteNumber:n,createdAt:serverTimestamp()});for(const x of items){const ir=doc(collection(db,'quote_items'));tx.set(ir,{companyId,quoteId:qr.id,productId:x.productId,nameSnapshot:x.name,unitPrice:x.unitPrice,quantity:x.quantity,total:x.unitPrice*x.quantity})}return n});d.remove();await load();toast('تم إنشاء العرض '+num)}catch(x){toast(x.message,true)}}}
function followModal(){const d=modal('إضافة متابعة',`<form id="ff" class="space-y-3"><input id="ft" required class="w-full border rounded-xl p-3" placeholder="عنوان المتابعة"><input id="fd" required type="date" class="w-full border rounded-xl p-3"><textarea id="fn" class="w-full border rounded-xl p-3" placeholder="ملاحظات"></textarea><button class="w-full bg-blue-600 text-white p-3 rounded-xl font-bold">حفظ</button></form>`);d.querySelector('#ff').onsubmit=async e=>{e.preventDefault();try{await addDoc(collection(db,'followups'),{companyId:S.profile.companyId,title:$('#ft').value,dueDate:$('#fd').value,notes:$('#fn').value,status:'pending',createdAt:serverTimestamp()});d.remove();await load();toast('تمت الإضافة')}catch(x){toast(x.message,true)}}}
async function share(id){const q=S.quotes.find(x=>x.id===id);window.open('https://wa.me/?text='+encodeURIComponent(`عرض سعر من ${S.company?.name||'توريدك'}\nرقم العرض: ${q?.quoteNumber}\nالعميل: ${q?.customerName}\nالإجمالي: ${money(q?.total)}`),'_blank')}
async function printQ(id){const q=S.quotes.find(x=>x.id===id),s=await getDocs(query(collection(db,'quote_items'),where('quoteId','==',id))),rows=s.docs.map(x=>x.data()).map(i=>`<tr><td>${esc(i.nameSnapshot)}</td><td>${money(i.unitPrice)}</td><td>${i.quantity}</td><td>${money(i.total)}</td></tr>`).join('');const w=window.open('','_blank');w.document.write(`<html dir="rtl"><head><meta charset="utf-8"><title>${esc(q.quoteNumber)}</title><style>body{font-family:Arial;padding:30px}h1{color:#2563eb}table{width:100%;border-collapse:collapse;margin-top:25px}th,td{border:1px solid #ddd;padding:10px;text-align:right}th{background:#f1f5f9}.total{font-size:20px;font-weight:bold;margin-top:20px}</style></head><body><h1>${esc(S.company?.name||'توريدك')}</h1><p>عرض سعر: <b>${esc(q.quoteNumber)}</b></p><p>العميل: ${esc(q.customerName)}</p><table><tr><th>المنتج</th><th>السعر</th><th>الكمية</th><th>الإجمالي</th></tr>${rows}</table><div class="total">الإجمالي: ${money(q.total)}</div><p>${esc(q.notes||'')}</p><script>setTimeout(()=>print(),300)<\/script></body></html>`);w.document.close()}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{S.view=b.dataset.nav;render()});$('#logout')?.addEventListener('click',()=>signOut(auth));$('#mlogout')?.addEventListener('click',()=>signOut(auth));$('#add')?.addEventListener('click',()=>dataModal(S.view==='customers'));$('#newq')?.addEventListener('click',quoteModal);$('#addf')?.addEventListener('click',followModal);document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('حذف العنصر؟')){await deleteDoc(doc(db,b.dataset.col,b.dataset.del));await load();toast('تم الحذف')}});document.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>share(b.dataset.wa));document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>printQ(b.dataset.pr))}
onAuthStateChanged(auth,async u=>{S.user=u;if(!u){S.profile=null;render();return}try{S.profile=await userData(u.uid);await load()}catch(e){toast(e.message,true);await signOut(auth)}});render();
</script></body></html>
